{
  "substitutions": {
    "_TAG": "manual"
  },
  "steps": [
    {
      "id": "build-env",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "bash",
      "args": [
        "-ec",
        "umask 077; gcloud secrets versions access latest --secret=members-env > .env.production"
      ]
    },
    {
      "id": "linux-build-and-check",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "build",
        "--secret",
        "id=build-env,src=.env.production",
        "--target",
        "build",
        "-t",
        "ci-check:$BUILD_ID",
        "."
      ],
      "env": [
        "DOCKER_BUILDKIT=1"
      ]
    },
    {
      "id": "credential-issuance-race-tests",
      "name": "gcr.io/cloud-builders/docker",
      "entrypoint": "sh",
      "args": [
        "-ec",
        "network=platform-ci-$BUILD_ID\ncontainer=platform-postgres-$BUILD_ID\ndocker network create \"$$network\" >/dev/null\ntrap 'docker rm -f \"$$container\" >/dev/null 2>&1 || true; docker network rm \"$$network\" >/dev/null 2>&1 || true' EXIT\ndocker run -d --name \"$$container\" --network \"$$network\" --network-alias platform-postgres --env POSTGRES_PASSWORD=ci-only --env POSTGRES_DB=platform_ci --health-cmd='pg_isready -U postgres' --health-interval=1s postgres:17-alpine >/dev/null\nfor attempt in $$(seq 1 60); do [ \"$$(docker inspect --format='{{.State.Health.Status}}' \"$$container\")\" = healthy ] && break; sleep 1; done\ndocker run --rm --network \"$$network\" --env PLATFORM_TEST_DATABASE_URL=postgresql://postgres:ci-only@platform-postgres:5432/platform_ci ci-check:$BUILD_ID sh -ec 'rm -f .env .env.*; node_modules/.bin/tsx --test tests/platform-admin/issuance-race.pg-test.ts'\n"
      ]
    },
    {
      "id": "platform-access-tests",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "run",
        "--rm",
        "ci-check:$BUILD_ID",
        "sh",
        "-ec",
        "rm -f .env .env.*; npm run test:platform-admin && node_modules/.bin/tsx --test tests/platform-access/*.test.ts"
      ]
    },
    {
      "id": "office-domain-tests",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "run",
        "--rm",
        "ci-check:$BUILD_ID",
        "sh",
        "-ec",
        "rm -f .env .env.* && npm run test:office-domain && npm run test:organization-launch && npm run test:public-tenants"
      ]
    },
    {
      "id": "unit-storage-tests",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "run",
        "--rm",
        "ci-check:$BUILD_ID",
        "sh",
        "-ec",
        "node --test scripts/schema-readiness.check.cjs && npm run test:storage"
      ]
    },
    {
      "id": "website-tests",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "run",
        "--rm",
        "ci-check:$BUILD_ID",
        "sh",
        "-ec",
        "rm -f .env .env.*; npm run test:website"
      ]
    },
    {
      "id": "quota-tests",
      "name": "gcr.io/cloud-builders/docker",
      "entrypoint": "sh",
      "args": [
        "-ec",
        "docker run -d --rm --name quota-db -e POSTGRES_PASSWORD=quota-test-only postgres:17; trap \"docker stop quota-db\" EXIT; for i in $$(seq 1 60); do docker exec quota-db pg_isready -U postgres && break; sleep 1; done; docker run --rm --network container:quota-db -e STORAGE_TEST_DATABASE_URL=postgres://postgres:quota-test-only@127.0.0.1:5432/postgres ci-check:$BUILD_ID sh -ec \"rm -f .env .env.*; npm run test:quota\""
      ]
    },
    {
      "id": "commerce-tests",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "-ec",
        "docker run -d --rm --name commerce-db -e POSTGRES_PASSWORD=commerce-test-only postgres:17; trap \"docker stop commerce-db\" EXIT; for i in $$(seq 1 60); do docker exec commerce-db pg_isready -U postgres && break; sleep 1; done; docker run --rm --network container:commerce-db -e COMMERCE_TEST_DATABASE_URL=postgres://postgres:commerce-test-only@127.0.0.1:5432/postgres ci-check:$BUILD_ID sh -ec \"rm -f .env .env.*; npm run test:storage-billing; npm run test:commerce\""
      ],
      "entrypoint": "sh"
    },
    {
      "id": "runtime-image",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "build",
        "--secret",
        "id=build-env,src=.env.production",
        "-t",
        "us-west1-docker.pkg.dev/$PROJECT_ID/ci-members/members:${_TAG}-$BUILD_ID",
        "."
      ],
      "env": [
        "DOCKER_BUILDKIT=1"
      ]
    },
    {
      "id": "export-runtime-layers",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "save",
        "-o",
        ".ci-image.tar",
        "us-west1-docker.pkg.dev/$PROJECT_ID/ci-members/members:${_TAG}-$BUILD_ID"
      ]
    },
    {
      "id": "verify-no-secret-layers",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "python3",
      "args": [
        "scripts/gcp-scan-image.py",
        ".ci-image.tar",
        ".env.production"
      ]
    },
    {
      "id": "install-schema-proxy",
      "name": "gcr.io/cloud-builders/docker",
      "entrypoint": "sh",
      "args": [
        "-ec",
        "docker create --name schema-proxy-binary gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.0 >/dev/null; trap \"docker rm -f schema-proxy-binary >/dev/null\" EXIT; docker cp schema-proxy-binary:/cloud-sql-proxy /workspace/.ci-cloud-sql-proxy; chmod 755 /workspace/.ci-cloud-sql-proxy"
      ]
    },
    {
      "id": "active-source-schema-readiness",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "run",
        "--rm",
        "--network",
        "cloudbuild",
        "-v",
        "/workspace/.env.production:/run/secrets/build-env:ro",
        "-v",
        "/workspace/.ci-cloud-sql-proxy:/run/cloudsql-proxy:ro",
        "ci-check:$BUILD_ID",
        "node",
        "scripts/schema-readiness.cjs",
        "members"
      ]
    },
    {
      "id": "remove-build-inputs",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "bash",
      "args": [
        "-ec",
        "rm -f .ci-image.tar .env.production .ci-cloud-sql-proxy"
      ]
    },
    {
      "id": "push-image",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "push",
        "us-west1-docker.pkg.dev/$PROJECT_ID/ci-members/members:${_TAG}-$BUILD_ID"
      ]
    },
    {
      "id": "release",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "bash",
      "args": [
        "-c",
        "set -euo pipefail\nimage='us-west1-docker.pkg.dev/$PROJECT_ID/ci-members/members:${_TAG}-$BUILD_ID'\ndigest=$(gcloud artifacts docker images describe \"$$image\" --format='value(image_summary.digest)')\nexport CI_SERVICE='members' CI_BUILD_ID='$BUILD_ID' CI_IMAGE=\"$${image%:*}@$$digest\"\npython3 scripts/gcp-release.py\n"
      ]
    }
  ],
  "images": [
    "us-west1-docker.pkg.dev/$PROJECT_ID/ci-members/members:${_TAG}-$BUILD_ID"
  ],
  "options": {
    "machineType": "E2_HIGHCPU_8",
    "logging": "CLOUD_LOGGING_ONLY"
  },
  "timeout": "1800s"
}
