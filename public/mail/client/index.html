<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXXES Mail</title><link rel="stylesheet" href="/mail/client/mail.css"></head><body>
<header><a class="wordmark" href="https://axxes.app">AXXES<span>MAIL</span></a><select id="organization" aria-label="Organization"><option>Loading organizations…</option></select><form id="search"><label class="sr-only" for="query">Search mail</label><input id="query" type="search" placeholder="Search your mail"><button>Search</button></form><select id="appearance" aria-label="Appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></header>
<main><nav aria-label="Mail folders"><button id="compose" class="primary" disabled>Compose</button><div id="folders"></div><button id="domains">Domains</button></nav><section class="messages" aria-label="Messages"><div class="toolbar"><h1 id="folder-name">Inbox</h1><button id="refresh">Refresh</button></div><p id="status" role="status" aria-live="polite">Opening your workspace…</p><div id="bulk" hidden><span id="selection-count"></span><button id="mark-unread">Unread</button><button id="archive">Archive</button><button id="delete">Delete</button></div><ol id="message-list"></ol><button id="more" hidden>Load more</button></section><article id="reading" aria-label="Message"><p class="quiet">Choose a message to read.</p></article></main>
<dialog id="composer"><form id="draft-form"><div class="toolbar"><h2>New message</h2><button type="button" id="close-compose" aria-label="Close composer">×</button></div><label>From<select id="from" required></select></label><label>To<input id="to" type="text" required placeholder="name@organization.com"></label><label>Subject<input id="subject" type="text"></label><label class="sr-only" for="body">Message</label><textarea id="body" rows="12" placeholder="Write your message…"></textarea><p id="draft-status" role="status">Not saved</p><div class="toolbar"><button class="primary" id="send" type="submit">Send</button><button type="button" id="save-draft">Save draft</button></div></form></dialog>
<dialog id="domain-dialog"><div class="toolbar"><h2>Mail domains</h2><button id="close-domains" aria-label="Close domains">×</button></div><p>Custom domains require ownership and delivery verification.</p><form id="add-domain"><label>Domain<input id="domain-name" placeholder="yourcompany.com" required></label><button>Add domain</button></form><p id="domain-status" role="status"></p><ul id="domain-list"></ul></dialog>
<script type="module" src="/mail/client/app.js"></script></body></html>
