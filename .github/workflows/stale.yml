name: Manage Stale Issues and PRs

on:
  schedule:
    - cron: '0 6 * * *' # Run daily at 6am UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale
    runs-on: ubuntu-latest

    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issue configuration
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity.
            
            It will be closed in 14 days if no further activity occurs.
            
            If this issue is still relevant:
            - Add a comment with an update
            - Remove the `stale` label
            
            Thank you for your contributions! 🎉
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
            
            Feel free to reopen if this is still relevant, or create a new issue with updated information.
          
          # PR configuration
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: |
            This PR has been automatically marked as stale because it has not had recent activity.
            
            It will be closed in 7 days if no further activity occurs.
            
            If this PR is still in progress:
            - Push new commits
            - Add a comment with an update
            - Remove the `stale` label
          close-pr-message: |
            This PR has been automatically closed due to inactivity.
            
            Feel free to reopen if you'd like to continue working on this.
          
          # Labels to exempt from stale
          exempt-issue-labels: 'pinned,security,bug,feature,help wanted'
          exempt-pr-labels: 'pinned,security,work-in-progress,wip'
          
          # Don't stale issues/PRs with milestones
          exempt-all-milestones: true
          
          # Operation limits
          operations-per-run: 100
          
          # Remove stale label when updated
          remove-stale-when-updated: true
          
          # Debug mode
          debug-only: false
